services:
  worker:
    image: nuscenes-trainer:1.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["python", "-m", "worker.agent", "--worker-id", "${WORKER_ID}"]
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      NUSC_DATA: /data
      TORCH_THREADS: ${TORCH_THREADS:-2}
    volumes:
      - ../data:/data
    restart: unless-stopped
